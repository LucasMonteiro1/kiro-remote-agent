name: Release

# Publishes a GitHub Release whenever a SemVer tag (vX.Y.Z) is pushed.
# The release carries one daemon tarball per supported platform (each with
# dist/ + production node_modules including node-pty's native prebuild for
# that platform + a vendor/ dir holding the local voice-transcription
# toolchain: a statically-linked whisper-cli, a static ffmpeg, and the ggml
# model + the bundled extension .vsix) plus the standalone .vsix. The
# install.sh installer and the daemon's self-updater both consume these
# assets — see src/updater.ts for the exact asset-naming contract.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the GitHub Release

jobs:
  # Build the extension once — it's a pure-Node esbuild bundle, identical
  # across platforms, so there's no need to rebuild it in the daemon matrix.
  build-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Node 22: @vscode/vsce pulls @azure/identity, which requires
          # Node >=22. This only affects the machine that *packages* the
          # .vsix — the extension itself is a plain esbuild bundle, so the
          # published artifact and the devs' runtime are unaffected.
          node-version: 22
      - name: Package extension
        working-directory: ide-extension
        run: |
          yarn install --frozen-lockfile
          npm pkg set version="${GITHUB_REF_NAME#v}"
          yarn package
          mv kiro-remote-bridge-*.vsix kiro-remote-bridge.vsix
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: extension
          path: ide-extension/kiro-remote-bridge.vsix

  # Build one daemon tarball per platform. Running yarn install on each
  # target runner is what pulls node-pty's correct native prebuild for that
  # OS/arch, so the dev never needs build tools.
  build-daemon:
    needs: build-extension
    strategy:
      matrix:
        include:
          - os: macos-26 # Apple Silicon (macOS Tahoe)
            target: darwin-arm64
          - os: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      # Pinned whisper.cpp build tag and ggml model bundled for local voice-
      # message transcription. Bumping WHISPER_CPP_REF here is all it takes to
      # ship a newer whisper.cpp; WHISPER_MODEL must match the daemon's
      # WHISPER_MODEL default in src/config.ts (both are "base").
      WHISPER_CPP_REF: b4938
      WHISPER_MODEL: base
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Set version from tag
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Build daemon
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Download extension .vsix
        uses: actions/download-artifact@v8.0.1
        with:
          name: extension
          path: .

      # --- Bundle the local-transcription toolchain (whisper.cpp + ffmpeg + model) ---
      # These three artifacts ship inside the tarball under vendor/, so a dev
      # who auto-updates gets voice-message transcription with zero setup: no
      # system ffmpeg, no model download, no build tools on their machine.
      # Built/fetched per-platform here on the matching runner, exactly like
      # node-pty's native prebuild.

      - name: Build whisper.cpp (whisper-cli, static)
        run: |
          git clone --depth 1 --branch "$WHISPER_CPP_REF" https://github.com/ggml-org/whisper.cpp whisper-src
          # Static libs (-DBUILD_SHARED_LIBS=OFF) link ggml/whisper straight
          # into whisper-cli, so the shipped binary is a single relocatable
          # file with no loose .so/.dylib to find on the dev's machine.
          cmake -S whisper-src -B whisper-src/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build whisper-src/build --config Release --target whisper-cli -j

      - name: Fetch ggml model
        run: |
          # whisper.cpp ships a helper that downloads the ggml model into
          # its models/ dir; grab the one matching the daemon's default.
          ( cd whisper-src && bash ./models/download-ggml-model.sh "$WHISPER_MODEL" )

      - name: Resolve static ffmpeg binary
        run: |
          # ffmpeg-static's postinstall downloads the correct static ffmpeg
          # for this runner's OS/arch; the package's main export is the
          # absolute path to that binary.
          mkdir -p ffmpeg-tmp
          ( cd ffmpeg-tmp && npm init -y >/dev/null 2>&1 && npm install ffmpeg-static@5.2.0 >/dev/null 2>&1 )
          FFMPEG_PATH="$(node -e "process.stdout.write(require('ffmpeg-tmp/node_modules/ffmpeg-static'))")"
          echo "FFMPEG_PATH=$FFMPEG_PATH" >> "$GITHUB_ENV"

      - name: Stage vendor/ artifacts
        run: |
          mkdir -p vendor
          cp whisper-src/build/bin/whisper-cli vendor/whisper-cli
          cp "whisper-src/models/ggml-${WHISPER_MODEL}.bin" "vendor/ggml-${WHISPER_MODEL}.bin"
          cp "$FFMPEG_PATH" vendor/ffmpeg
          chmod +x vendor/whisper-cli vendor/ffmpeg
          # Sanity-check the bundled toolchain actually runs on this runner
          # before we ship it, so a broken build fails the release instead of
          # silently shipping a non-working binary.
          ./vendor/whisper-cli --help >/dev/null
          ./vendor/ffmpeg -version >/dev/null

      - name: Assemble release tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="stage/kiro-remote-agent"
          mkdir -p "$STAGE"
          # Production-only node_modules (brings node-pty's prebuild for this runner's platform).
          cp package.json yarn.lock "$STAGE/"
          ( cd "$STAGE" && yarn install --production --frozen-lockfile )
          cp -R dist "$STAGE/dist"
          cp -R vendor "$STAGE/vendor"
          cp .env.example "$STAGE/.env.example"
          cp kiro-remote-bridge.vsix "$STAGE/kiro-remote-bridge.vsix"
          tar -czf "kiro-remote-agent-${VERSION}-${{ matrix.target }}.tar.gz" -C stage kiro-remote-agent

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: daemon-${{ matrix.target }}
          path: kiro-remote-agent-*.tar.gz

  # Collect every artifact and attach them to the tag's GitHub Release.
  release:
    needs: build-daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
      - name: Create/Update Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            artifacts/daemon-*/kiro-remote-agent-*.tar.gz
            artifacts/extension/kiro-remote-bridge.vsix
          generate_release_notes: true
